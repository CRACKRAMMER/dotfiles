[mgr]
prepend_keymap = [
  { on = "l", run = "plugin smart-enter", desc = "Open file or enter directory" },
  { on = "<Enter>", run = "plugin smart-enter", desc = "Open file or enter directory" },
  { on = "S", run = 'shell "$SHELL" --block', desc = "Open shell here" },
  { on = ["'", "a"], run = "plugin yamb -- save", desc = "Add bookmark" },
  { on = ["'", "'"], run = "plugin yamb -- jump_by_fzf", desc = "Find bookmark" },
  { on = ["'", "r"], run = "plugin yamb -- delete_by_key", desc = "Delete bookmark" },
  { on = ["c", "a"], run = "plugin compress", desc = "Archive selected files" },
]
