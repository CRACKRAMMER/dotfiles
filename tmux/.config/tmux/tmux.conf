# cat << EOF > /dev/null

# -- general
setw -g xterm-keys on
set -s escape-time 0
set -sg repeat-time 300
set -s focus-events on
set -g mouse on
set -sg exit-empty on

set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

set -g history-limit 10000
set-option -g allow-passthrough on

set-hook -g pane-focus-in "run -b 'bash ~/.config/tmux/fzf_panes.tmux update_mru_pane_ids'"
bind -n M-w run -b 'bash ~/.config/tmux/fzf_panes.tmux new_window'

# reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display '~/.config/tmux/tmux.conf sourced'

set -ga update-environment ' DISPLAY WAYLAND_DISPLAY XAUTHORITY SSH_AUTH_SOCK DBUS_SESSION_BUS_ADDRESS XDG_CONFIG_HOME XDG_CACHE_HOME XDG_DATA_HOME XDG_RUNTIME_DIR XDG_SESSION_TYPE XDG_CURRENT_DESKTOP FZF_DEFAULT_OPTS'

# -- prefix
unbind C-b
set -g prefix 'C-s'

# -- display
set -g base-index 1
setw -g pane-base-index 1

setw -g automatic-rename on
set -g renumber-windows on

set -g set-titles on

set -g display-panes-time 2000
set -g display-time 2000

set -g status-interval 5

# -- navigation

# create session
bind C-c new-session

# window management
bind -n M-o new-window -c "#{pane_current_path}"
bind -n M-O break-pane
bind -n M-Q kill-pane

# window navigation
unbind n
unbind p
unbind 1
unbind 2
unbind 3
unbind 4
unbind 5
unbind 6
unbind 7
unbind 8
unbind 9
unbind 0
bind -r C-p previous-window
bind -r C-n next-window

bind k split-window -vb -c "#{pane_current_path}"
bind j split-window -v -c "#{pane_current_path}"
bind h split-window -hb -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


bind -n M-! join-pane -t :1
bind -n M-@ join-pane -t :2
bind -n 'M-#' join-pane -t :3
bind -n 'M-$' join-pane -t :4
bind -n M-% join-pane -t :5
bind -n M-^ join-pane -t :6
bind -n M-& join-pane -t :7
bind -n M-* join-pane -t :8
bind -n M-( join-pane -t :9

bind -n M-f resize-pane -Z

# pane navigation
bind 1 select-pane -t:.1
bind 2 select-pane -t:.2
bind 3 select-pane -t:.3
bind 4 select-pane -t:.4
bind 5 select-pane -t:.5
bind 6 select-pane -t:.6
bind 7 select-pane -t:.7
bind 8 select-pane -t:.8
bind 9 select-pane -t:.9
bind 0 select-pane -t:.10
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Match the vim-tmux-navigator plugin's Ctrl-h/j/k/l mappings.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([[:alnum:]_./-]*/)?g?[.]?([ln]?vim|view|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind > swap-pane -D
bind < swap-pane -U
bind | swap-pane
bind -n M-Space next-layout

bind W choose-tree -Z
bind S choose-tree 'move-pane -v -s "%%"'
bind V choose-tree 'move-pane -h -s "%%"'

# pane resizing
bind -n M-H resize-pane -L 3
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 3

set -g status-keys emacs
set -g mode-keys vi

bind -n M-v copy-mode

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# bind -T copy-mode-vi h send-keys -X cursor-left
# bind -T copy-mode-vi l send-keys -X cursor-right
# bind -T copy-mode-vi k send-keys -X cursor-up
# bind -T copy-mode-vi j send-keys -X cursor-down
# bind -T copy-mode-vi n send-keys -X next-word-end
# bind -T copy-mode-vi K send-keys -N 5 -X cursor-up
# bind -T copy-mode-vi J send-keys -N 5 -X cursor-down
# bind -T copy-mode-vi g send-keys -X start-of-line
# bind -T copy-mode-vi G send-keys -X end-of-line
bind -T copy-mode-vi Y send-keys -X copy-end-of-line
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
set -s copy-command "$HOME/.config/tmux/clipboard.sh"
set -s set-clipboard external
# bind -T copy-mode-vi = send-keys -X search-again
# bind -T copy-mode-vi = send-keys -X search-reverse

# bind b list-buffers
# bind p paste-buffer

# -- toggle_syn_input
bind C-g setw synchronize-panes

# -- toggle_status
bind s if-shell '[[ $(tmux show -g status | cut -d\  -f2) == "on" ]]' \
'set -g status off' \
'set -g status on'

# -- fzf_url
# bind u run -b 'cut -c3- ~/.config/tmux/tmux.conf | sh -s fzf_url'
#
# run 'cut -c3- ~/.config/tmux/tmux.conf | sh -s bind_with_sys_clipboard'

# -- Tokyo Night Moon theme
set -g status-position bottom
set -g status-style 'bg=#1e2030,fg=#c8d3f5'
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 80
set -g status-left '#[fg=#1e2030,bg=#82aaff,bold] #{?client_prefix,⌨ ,}#S #[fg=#82aaff,bg=#1e2030]'
set -g status-right '#[fg=#828bb8] #{b:pane_current_path}  #[fg=#ffc777,bold]%Y-%m-%d %H:%M '
setw -g window-status-separator ''
setw -g window-status-format '#[fg=#828bb8,bg=#1e2030] #I #W '
setw -g window-status-current-format '#[fg=#1e2030,bg=#82aaff,bold] #I #[fg=#c8d3f5,bg=#3b4261,bold] #W#{?window_zoomed_flag, 󰁌,} #[fg=#3b4261,bg=#1e2030]'
setw -g window-status-activity-style 'fg=#ffc777,bg=#1e2030'
setw -g window-status-bell-style 'fg=#ff757f,bg=#1e2030'
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#82aaff'
set -g message-style 'fg=#c8d3f5,bg=#3b4261'
set -g mode-style 'fg=#1e2030,bg=#ffc777'

# Per-machine overrides are kept outside Git.
if-shell 'test -r ~/.config/tmux/local.conf' 'source-file ~/.config/tmux/local.conf'
